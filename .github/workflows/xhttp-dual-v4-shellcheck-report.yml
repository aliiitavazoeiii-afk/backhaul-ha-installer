name: XHTTP Dual v4 shellcheck report

on:
  push:
    branches: [xhttp-dual-sticky-failover]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck report
        shell: bash
        run: |
          set +e
          shellcheck \
            install-foreign.sh \
            install-dual-iran.sh \
            install-dual-iran-final.sh \
            upgrade-dual-hardening.sh \
            upgrade-foreign-reality-hardening.sh \
            set-xhttp-node-sni.sh \
            > shellcheck-report.txt 2>&1
          rc=$?
          cat shellcheck-report.txt
          echo "$rc" > shellcheck-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: xhttp-dual-v4-shellcheck-report
          path: |
            shellcheck-report.txt
            shellcheck-exit-code.txt
