name: Aegis-T

on:
  push:
    branches:
      - main
      - agent/aegis-t-v1
    paths:
      - 'aegis-t/**'
      - '.github/workflows/aegis-t.yml'
  pull_request:
    paths:
      - 'aegis-t/**'
      - '.github/workflows/aegis-t.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Detect Aegis-T source
        id: source
        run: |
          if [ -d aegis-t ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Format
        if: steps.source.outputs.present == 'true'
        working-directory: aegis-t
        run: test -z "$(gofmt -l .)"
      - name: Vet
        if: steps.source.outputs.present == 'true'
        working-directory: aegis-t
        run: go vet ./...
      - name: Test with race detector
        if: steps.source.outputs.present == 'true'
        working-directory: aegis-t
        run: go test ./... -race -count=1 -timeout=60s
      - name: Build and verify version
        if: steps.source.outputs.present == 'true'
        working-directory: aegis-t
        run: |
          go build -trimpath -o /tmp/aegis-t ./cmd/aegis-t
          test "$(/tmp/aegis-t -version)" = "1.0.0"
