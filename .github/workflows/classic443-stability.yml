name: Classic443 stability

on:
  push:
    branches:
      - agent/frp-classic443-hardened-v1
    paths:
      - 'frp-classic443-hardened/**'
      - '.github/workflows/classic443-stability.yml'
  pull_request:
    paths:
      - 'frp-classic443-hardened/**'
      - '.github/workflows/classic443-stability.yml'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n frp-classic443-hardened/install.sh
          bash -n frp-classic443-hardened/install-mux-v4.sh
          bash -n frp-classic443-hardened/upgrade-stability-v3.sh
          bash -n frp-classic443-hardened/upgrade-mux-v4.sh
          bash -n frp-classic443-hardened/uninstall.sh
      - name: Final mux-v4 wrapper invariants
        run: |
          set -euo pipefail
          I=frp-classic443-hardened/install.sh
          U=frp-classic443-hardened/uninstall.sh

          # Wrapper must always delegate to the immutable, field-tested final
          # mux-v4 installer and never to a mutable branch URL.
          grep -q 'BASE_COMMIT="44bf91a05897aca624614fabb6528453a146daa1"' "$I"
          grep -q 'BASE_URL="https://raw.githubusercontent.com/aliiitavazoeiii-afk/backhaul-ha-installer/${BASE_COMMIT}/frp-classic443-hardened/install.sh"' "$I"

          # Fresh Iran installs may stop only idle/stock package services.
          grep -q 'safe_stop_stock_haproxy' "$I"
          grep -q 'HAProxy has live listeners' "$I"
          grep -q 'HAProxy has application routing sections' "$I"
          grep -q 'safe_stop_stock_nginx' "$I"
          grep -q 'Nginx has active conf.d vhosts' "$I"
          grep -q 'Nginx has enabled non-default sites' "$I"
          grep -q 'Nginx has non-default live listeners' "$I"

          # Do not touch these services at all on Foreign installs.
          grep -q 'if \[\[ "$ROLE" == iran \]\]; then' "$I"

          # Uninstall must still remove all project FRPC/FRPS drop-ins.
          grep -q 'rm -rf "$FRPC_DROPIN_DIR" "$FRPS_DROPIN_DIR"' "$U"

          # Production remains single-client/no-shard.
          if grep -Eiq 'enable[-_ ]?4[-_ ]?shard|shard@|16-shard' "$I"; then
            echo 'shard logic found in final production wrapper' >&2
            exit 1
          fi
