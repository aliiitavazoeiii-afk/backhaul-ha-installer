name: Classic443 stability

on:
  push:
    branches:
      - agent/frp-classic443-hardened-v1
    paths:
      - 'frp-classic443-hardened/**'
      - '.github/workflows/classic443-stability.yml'
  pull_request:
    paths:
      - 'frp-classic443-hardened/**'
      - '.github/workflows/classic443-stability.yml'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n frp-classic443-hardened/install.sh
          bash -n frp-classic443-hardened/install-mux-v4.sh
          bash -n frp-classic443-hardened/upgrade-stability-v3.sh
          bash -n frp-classic443-hardened/upgrade-mux-v4.sh
          bash -n frp-classic443-hardened/uninstall.sh
      - name: Mux-v4 invariants
        run: |
          set -euo pipefail
          M=frp-classic443-hardened/upgrade-mux-v4.sh
          F=frp-classic443-hardened/install-mux-v4.sh

          grep -q 'transport.tcpMux = true' "$M"
          grep -q 'transport.maxPoolCount = 256' "$M"
          grep -q 'transport.poolCount = 128' "$M"
          grep -q 'transport.tcpMuxKeepaliveInterval = 30' "$M"
          grep -q 'MemorySwapMax=0' "$M"
          grep -q 'MemoryMax=768M' "$M"
          grep -q 'GOMEMLIMIT=512MiB' "$M"
          grep -q 'upgrade-mux-v4.sh' "$F"

          # Production profile must remain single client / no shards.
          if grep -Eiq 'enable[-_ ]?4[-_ ]?shard|shard@|16-shard' "$M" "$F"; then
            echo 'shard logic found in mux-v4 production profile' >&2
            exit 1
          fi
