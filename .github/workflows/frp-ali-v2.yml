name: FRP Ali v2 checks

on:
  push:
    branches:
      - "agent/frp-tunnel-ali-custom-v2"
    paths:
      - "frp-tunnel-ali-custom/**"
      - ".github/workflows/frp-ali-v2.yml"
  pull_request:
    paths:
      - "frp-tunnel-ali-custom/**"
      - ".github/workflows/frp-ali-v2.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Bash syntax and static invariants
        run: |
          chmod +x frp-tunnel-ali-custom/tests/*.sh
          frp-tunnel-ali-custom/tests/test-static.sh
      - name: ShellCheck
        run: |
          shellcheck -x \
            frp-tunnel-ali-custom/install.sh \
            frp-tunnel-ali-custom/frp-tunnel \
            frp-tunnel-ali-custom/bootstrap.sh \
            frp-tunnel-ali-custom/tests/*.sh
      - name: FRP v0.71.0 config schema smoke test
        run: frp-tunnel-ali-custom/tests/config-smoke.sh
