name: XHTTP Dual v4 checks

on:
  push:
    branches: [xhttp-dual-sticky-failover]
  pull_request:
    branches: [xhttp-dual-sticky-failover]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n install-foreign.sh
          bash -n install-foreign-vision.sh
          bash -n install-dual-iran.sh
          bash -n install-dual-iran-final.sh
          bash -n install-dual-iran-vision.sh
          bash -n upgrade-dual-user-routing.sh
          bash -n upgrade-dual-latency-health.sh
          bash -n upgrade-dual-hardening.sh
          bash -n upgrade-foreign-reality-hardening.sh
          bash -n rollback-foreign-reality-hardening.sh
          bash -n set-xhttp-node-sni.sh
          bash -n replace-xhttp-node.sh
          bash -n migrate-dual-node-vision.sh
          bash -n resume-dual-node-vision-canary.sh
          bash -n migrate-live-dual-node-vision.sh
          bash -n activate-staged-vision-node.sh
          bash -n rollback-dual-node-vision.sh
          bash -n reset-dual-tunnel.sh
      - name: Python syntax
        run: |
          python3 -m py_compile dual-controller.py dual-controller-v2.py dual-controller-v3.py dual-controller-v4.py
      - name: Production hardening invariants
        run: |
          grep -q '127.0.0.1:${DECOY_PORT}' upgrade-foreign-reality-hardening.sh
          grep -q 'DECOY_ZONE' upgrade-foreign-reality-hardening.sh
          grep -q 'Provider/PTR candidate' upgrade-foreign-reality-hardening.sh
          grep -q 'disable_tlsalpn_challenge' upgrade-foreign-reality-hardening.sh
          ! grep -q 'CAMOUFLAGE_HOST.*noded.cloud' upgrade-foreign-reality-hardening.sh
          grep -q 'healthy_probe_interval' dual-controller-v4.py
          grep -q '_next_probe' dual-controller-v4.py
          grep -q 'controller-v4.py daemon' upgrade-dual-hardening.sh
          ! grep -q '^apt-get update' install-foreign.sh
      - name: Vision migration invariants
        run: |
          grep -q 'xtls-rprx-vision' install-foreign-vision.sh
          grep -q '"network": "raw"' install-foreign-vision.sh
          grep -q 'dl.google.com:443' install-foreign-vision.sh
          grep -q 'REDIRECT --to-ports' migrate-dual-node-vision.sh
          grep -q 'Existing established' migrate-dual-node-vision.sh
          grep -q 'x-ui restart   : NO' migrate-dual-node-vision.sh
          grep -q 'add_rule tcp; add_rule udp' resume-dual-node-vision-canary.sh
          grep -q "ns\['drained'\]=True" resume-dual-node-vision-canary.sh
          grep -q 'x-ui PID unchanged' resume-dual-node-vision-canary.sh
      - name: Clean Vision installer invariants
        run: |
          grep -q 'No XHTTP. No iptables redirect' install-dual-iran-vision.sh
          grep -q 'xtls-rprx-vision' install-dual-iran-vision.sh
          grep -q '"network": "raw"' install-dual-iran-vision.sh
          grep -q 'SOCKS1="${SOCKS1:-12818}"' install-dual-iran-vision.sh
          grep -q 'SOCKS2="${SOCKS2:-12819}"' install-dual-iran-vision.sh
          grep -q 'controller-v4.py daemon' install-dual-iran-vision.sh
