name: custom-backhaul-build

on:
  push:
    branches:
      - agent/custom-backhaul-v2
    paths:
      - 'custom-backhaul/**'
      - '.github/workflows/custom-backhaul-build.yml'
  pull_request:
    paths:
      - 'custom-backhaul/**'
      - '.github/workflows/custom-backhaul-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout installer repo
        uses: actions/checkout@v4

      - name: Validate custom shell syntax
        run: |
          bash -n custom-backhaul/enable-stealth-wss.sh
          bash -n custom-backhaul/rollback-stealth-wss.sh
          bash -n custom-backhaul/verify-stealth-wss.sh
          bash -n custom-backhaul/upgrade-phase2-diagnostics.sh
          bash -n custom-backhaul/upgrade-phase2-split-tls.sh
          bash -n custom-backhaul/verify-phase2-split-tls.sh
          bash -n custom-backhaul/cleanup-phase2-ab.sh
          bash -n custom-backhaul/upgrade-phase3-diagnostics.sh
          bash -n custom-backhaul/enable-phase3-tcptls.sh
          bash -n custom-backhaul/enable-phase3-tcptls-v2.sh
          bash -n custom-backhaul/rollback-phase3-tcptls.sh
          bash -n custom-backhaul/verify-phase3-tcptls.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.1'

      - name: Checkout pinned Backhaul v0.7.2
        run: |
          git clone --depth 1 --branch v0.7.2 https://github.com/Musixal/Backhaul.git /tmp/backhaul
          cd /tmp/backhaul
          git rev-parse HEAD

      - name: Apply private patch set
        run: |
          python3 custom-backhaul/apply_patch.py /tmp/backhaul
          python3 custom-backhaul/fix_wsmux_config.py /tmp/backhaul
          python3 custom-backhaul/fix_wss_alpn.py /tmp/backhaul

      - name: Add pinned uTLS dependency
        working-directory: /tmp/backhaul
        run: |
          go get github.com/refraction-networking/utls@v1.6.7

      - name: Format and inspect diff
        working-directory: /tmp/backhaul
        run: |
          gofmt -w config/config.go internal/server/server.go internal/client/client.go internal/server/transport/wsmux.go internal/client/transport/wsmux.go internal/utils/network/ws_dialer.go
          git diff --check
          git diff --stat
          grep -F 'alpn.AlpnProtocols = []string{"http/1.1"}' internal/utils/network/ws_dialer.go

      - name: Test
        working-directory: /tmp/backhaul
        run: go test ./...

      - name: Build static amd64 binary
        working-directory: /tmp/backhaul
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/backhaul-custom-v2 .
          sha256sum /tmp/backhaul-custom-v2 | tee /tmp/backhaul-custom-v2.sha256
          /tmp/backhaul-custom-v2 --help >/tmp/backhaul-help.txt 2>&1 || true
          file /tmp/backhaul-custom-v2

      - name: Upload custom binary
        uses: actions/upload-artifact@v4
        with:
          name: backhaul-custom-v2-linux-amd64
          path: |
            /tmp/backhaul-custom-v2
            /tmp/backhaul-custom-v2.sha256
            /tmp/backhaul-help.txt
          if-no-files-found: error
