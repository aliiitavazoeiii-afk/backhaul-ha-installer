name: Aegis CLI

on:
  push:
    branches: ["agent/aegis-single-release"]
    paths:
      - "aegis-cli/**"
      - ".github/workflows/aegis-cli.yml"
  pull_request:
    paths:
      - "aegis-cli/**"
      - ".github/workflows/aegis-cli.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: bash -n aegis-cli/setup.sh

      - name: ShellCheck
        run: shellcheck -S warning aegis-cli/setup.sh

      - name: Verify immutable production pins
        run: |
          grep -Fq "AEGIS_PIN='ef0e8a44065ca537c976858c9f9ae8f7a503313c'" aegis-cli/setup.sh
          grep -Fq "BACKUP_PIN='2be6343fb6af4e99d5c019eaf698e06047388b73'" aegis-cli/setup.sh

      - name: Verify tunnel-only safety invariants
        run: |
          grep -Fq "StrictHostKeyChecking=accept-new" aegis-cli/setup.sh
          grep -Fq "REMOTE HOST IDENTIFICATION HAS CHANGED" aegis-cli/setup.sh
          grep -Fq "read -rs pw" aegis-cli/setup.sh
          grep -Fq "retry_cmd 4 3 ssh" aegis-cli/setup.sh
          grep -Fq "retry_cmd 4 3 scp" aegis-cli/setup.sh
          grep -Fq "systemctl is-active --quiet x-ui" aegis-cli/setup.sh
          grep -Fq "/dev/tcp/127.0.0.1/443" aegis-cli/setup.sh
          grep -Fq "Existing Aegis backup relay detected; reusing it" aegis-cli/setup.sh
          grep -Fq "server[[:space:]]+direct_backup" aegis-cli/setup.sh
          grep -Fq "This installer never installs or modifies 3x-ui." aegis-cli/setup.sh
          grep -Fq "This installer does not install, clone, sync, reset, or modify 3x-ui." aegis-cli/setup.sh

      - name: Ensure 3x-ui remains user-managed
        run: |
          ! grep -Eq 'MHSanaei|x-ui-linux|panel/api/inbounds|setting -username|PRAGMA quick_check' aegis-cli/setup.sh

      - name: No mutable dependency URLs for Aegis installers
        run: |
          ! grep -E "raw.githubusercontent.com/.*/(main|master|agent/aegis-single-release)/aegis-single/(install|add-direct-backup)\.sh" aegis-cli/setup.sh
